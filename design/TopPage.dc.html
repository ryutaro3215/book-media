<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
  body { margin: 0; background: #FFFFFF; }
  a { color: #2F4A3F; }
  a:hover { color: #23392F; }
</style>
</helmet>

<div style="font-family: 'Zen Kaku Gothic New', sans-serif; background: #FFFFFF; color: #292929; min-height: 100vh; display: flex; flex-direction: column;">

  <dc-import name="SiteHeader" style="position: sticky; top: 0; z-index: 20;" hint-size="100%,73px"></dc-import>

  <main style="flex: 1 1 auto; max-width: 660px; margin: 0 auto; padding: 64px 20px 0 20px; width: 100%; box-sizing: border-box;">
    <div style="font-size: 12px; color: #787878; letter-spacing: 0.1em; margin-bottom: 8px;">記事一覧</div>
    <sc-for list="{{ articles }}" as="a" hint-placeholder-count="3">
      <a href="#" style="display: flex; gap: 20px; align-items: flex-start; text-decoration: none; color: inherit; padding: 28px 0; border-top: 1px solid #E6E6E6;">
        <div style="width: 104px; height: 78px; flex: 0 0 104px; overflow: hidden; background: #F5F4F1;">
          <image-slot id="{{ a.thumbId }}" shape="rect" placeholder="書影" style="width: 100%; height: 100%;"></image-slot>
        </div>
        <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #787878;">
            <span>{{ a.field }}</span>
            <span style="width: 1px; height: 12px; background: #E6E6E6;"></span>
            <span>{{ a.date }}</span>
          </div>
          <div style="font-size: 20px; font-weight: 700; line-height: 1.6; text-wrap: pretty;">{{ a.title }}</div>
          <div style="font-size: 14px; color: #787878; line-height: 1.7;">{{ a.author }}</div>
        </div>
      </a>
    </sc-for>
    <div style="border-top: 1px solid #E6E6E6;"></div>

    <section style="margin-top: 72px;">
      <div style="font-size: 12px; color: #787878; letter-spacing: 0.1em; margin-bottom: 16px;">分野から探す</div>
      <div style="display: flex; flex-wrap: wrap; gap: 12px;">
        <a href="#" style="font-size: 14px; text-decoration: none; padding: 9px 16px; border: 1px solid #E6E6E6; border-radius: 999px; color: #292929;">行動経済学</a>
        <a href="#" style="font-size: 14px; text-decoration: none; padding: 9px 16px; border: 1px solid #E6E6E6; border-radius: 999px; color: #292929;">中世哲学</a>
        <a href="#" style="font-size: 14px; text-decoration: none; padding: 9px 16px; border: 1px solid #E6E6E6; border-radius: 999px; color: #292929;">統計学</a>
      </div>
    </section>

    </main>

  <div style="max-width: 660px; margin: 64px auto 0 auto; padding: 0 20px; width: 100%; box-sizing: border-box;">
    <dc-import name="SiteFooter" hint-size="100%,180px"></dc-import>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      articles: [
        { field: '行動経済学', title: '山田太郎が選ぶ、行動経済学を学ぶための5冊', author: '山田太郎（○○大学 経済学部 教授）', date: '2026年8月4日', thumbId: 'thumb-yamada' },
        { field: '中世哲学', title: '佐藤花子が選ぶ、中世哲学への入り口となる5冊', author: '佐藤花子（△△大学 文学部 准教授）', date: '2026年7月28日', thumbId: 'thumb-sato' },
        { field: '統計学', title: '鈴木一郎が選ぶ、統計学の考え方がわかる5冊', author: '鈴木一郎（□□大学 理学部 教授）', date: '2026年7月20日', thumbId: 'thumb-suzuki' },
      ],
    };
  }
}
</script>
</body>
</html>
