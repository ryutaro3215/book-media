<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
  body { margin: 0; background: #FFFFFF; }
  a { color: #2F4A3F; }
  a:hover { color: #23392F; }
</style>
</helmet>

<div style="font-family: 'Zen Kaku Gothic New', sans-serif; background: #FFFFFF; color: #292929; min-height: 100vh; display: flex; flex-direction: column;">

  <dc-import name="SiteHeader" style="position: sticky; top: 0; z-index: 20;" hint-size="100%,73px"></dc-import>

  <div style="display: flex; align-items: flex-start; flex: 1 1 auto;">
    <div style="flex: 0 0 232px; width: 232px; position: sticky; top: 68px; align-self: flex-start; max-height: calc(100vh - 68px);">
      <dc-import name="SideNav" hint-size="232px,600px"></dc-import>
    </div>
    <main style="flex: 1 1 auto; min-width: 0; max-width: 660px; margin: 0 auto; padding: 56px 28px 0 28px; box-sizing: border-box;">
    <div style="display: flex; align-items: baseline; gap: 14px; margin-bottom: 40px;">
      <h1 style="font-size: clamp(26px, 3.6vw, 32px); font-weight: 700; line-height: 1.4; margin: 0;">行動経済学</h1>
      <span style="font-size: 14px; color: #787878;">記事1本</span>
    </div>

    <a href="#" style="display: flex; gap: 20px; align-items: flex-start; text-decoration: none; color: inherit; padding: 28px 0; border-top: 1px solid #E6E6E6; border-bottom: 1px solid #E6E6E6;">
      <div style="width: 96px; height: 72px; flex: 0 0 96px; overflow: hidden; background: #F5F4F1;">
        <image-slot id="topic-thumb-1" shape="rect" placeholder="書影" style="width: 100%; height: 100%;"></image-slot>
      </div>
      <div style="flex: 1 1 auto; min-width: 0;">
        <div style="font-size: 13px; color: #787878; margin-bottom: 10px;">2026年8月4日</div>
        <div style="font-size: 19px; font-weight: 700; line-height: 1.6; margin-bottom: 10px;">山田太郎が選ぶ、行動経済学を学ぶための5冊</div>
        <div style="font-size: 14px; color: #787878;">山田太郎（○○大学 経済学部 教授）</div>
      </div>
    </a>

    <section style="margin-top: 72px;">
      <div style="font-size: 12px; color: #787878; letter-spacing: 0.1em; margin-bottom: 16px;">ほかの分野</div>
      <div style="display: flex; flex-wrap: wrap; gap: 12px;">
        <a href="#" style="font-size: 14px; text-decoration: none; padding: 9px 16px; border: 1px solid #E6E6E6; border-radius: 999px; color: #292929;">中世哲学</a>
        <a href="#" style="font-size: 14px; text-decoration: none; padding: 9px 16px; border: 1px solid #E6E6E6; border-radius: 999px; color: #292929;">統計学</a>
      </div>
    </section>
    </main>
  </div>

  <div style="max-width: 660px; margin: 72px auto 0 auto; padding: 0 28px; width: 100%; box-sizing: border-box;">
    <dc-import name="SiteFooter" hint-size="100%,180px"></dc-import>
  </div>

</div>
</x-dc>
</body>
</html>
